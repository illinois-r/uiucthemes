title: UIUC Illinois Beamer Theme
author: James Joseph Balamuta
version: 1.0.0
quarto-required: ">=1.3.0"
contributes:
  formats:
    beamer:
      # Classic "Illinois" look: AnnArbor structure recolored with the
      # official University of Illinois Urbana-Champaign blue and orange.
      theme: AnnArbor
      colortheme: wolverine
      navigation: empty
      include-in-header:
        - uiuc-illinois.tex
      # Ship the Illinois logo so the title-slide \includegraphics can find it.
      format-resources:
        - ilogo.pdf
