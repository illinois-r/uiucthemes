title: UIUC Orange Beamer Theme
author: Steven Andrew Culpepper
version: 1.0.0
quarto-required: ">=1.3.0"
contributes:
  formats:
    beamer:
      # Minimalist "Orange" look: Frankfurt structure + dove (grayscale)
      # color theme recolored toward Illinois orange and white.
      theme: Frankfurt
      colortheme: dove
      navigation: empty
      include-in-header:
        - uiuc-orange.tex
      # Ship the Illinois logo so the title-slide \includegraphics can find it.
      format-resources:
        - ilogo.pdf
